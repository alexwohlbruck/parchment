<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parchment</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px/1.5 system-ui, -apple-system, sans-serif;
        color: #57534e;
        background: #faf9f7;
      }
      main {
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #a8a29e;
          background: #1c1917;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p id="message">Signing in…</p>
    </main>
    <script>
      // The signer returns the session in the fragment, which never reaches a
      // server. Hand it to the app tab that opened this popup, then close.
      var params = new URLSearchParams(location.hash.slice(1))
      var result = {
        type: 'mangrove-signer-callback',
        state: params.get('state'),
        sessionToken: params.get('session_token'),
        reviewerId: params.get('reviewer_id'),
        did: params.get('did'),
        error: params.get('error_description') || params.get('error'),
      }
      history.replaceState(null, '', location.pathname)

      try {
        var channel = new BroadcastChannel('mangrove-signer')
        channel.postMessage(result)
        channel.close()
      } catch (error) {}

      window.close()

      setTimeout(function () {
        document.getElementById('message').textContent = result.sessionToken
          ? 'You are signed in to Mangrove. You can close this window.'
          : result.error || 'Signing in to Mangrove did not complete.'
      }, 300)
    </script>
  </body>
</html>
