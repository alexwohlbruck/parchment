headersOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "/home/alex/Documents/code/parchment/web/dist"
publishOrigin = "config"
commandOrigin = "config"
base = "/home/alex/Documents/code/parchment/web"
command = "bun install && cd ../server && bun install --ignore-scripts && cd ../web && bun run build:ci"
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../server/src/types ../server/src/lib ../server/src/schema"

[build.environment]
NODE_VERSION = "22"

[build.processing]

[build.processing.css]

[build.processing.html]

