name: E2E Tests

on:
  pull_request:
    branches: [main, dev]

env:
  POSTGRES_DB: parchment_test
  POSTGRES_USER: test_user
  POSTGRES_PASSWORD: test_password
  SERVER_ORIGIN: http://localhost:5001
  CLIENT_ORIGIN: http://localhost:5174
  APP_TESTER_EMAIL: test@parchment.local
  GMAIL_EMAIL: ''
  GMAIL_APP_PASSWORD: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 26 hangs `playwright install` (Playwright 1.58).
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run web unit tests
        working-directory: web
        run: bun run test -- run

      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: Create .env.test
        run: |
          echo "POSTGRES_DB=$POSTGRES_DB" > .env.test
          echo "POSTGRES_USER=$POSTGRES_USER" >> .env.test
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env.test
          echo "SERVER_ORIGIN=$SERVER_ORIGIN" >> .env.test
          echo "CLIENT_ORIGIN=$CLIENT_ORIGIN" >> .env.test
          echo "APP_TESTER_EMAIL=$APP_TESTER_EMAIL" >> .env.test
          echo "GMAIL_EMAIL=$GMAIL_EMAIL" >> .env.test
          echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD" >> .env.test
          cat .env.test

      - name: Run E2E tests
        working-directory: web
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7
