name: OpenAPI Spec

# Keeps `server/openapi.json` in step with the routes.
#
# The docs site's API reference is generated from this file. It used to be
# generated by fetching `/docs/json` off a running instance, which meant the
# reference only refreshed when someone remembered to run the generator by hand
# on a machine that happened to have the server up — so it drifted.
#
# Committing the spec makes API surface changes reviewable in the diff and
# decouples the docs build from any instance being reachable. Generation needs
# no database and no server: the script mounts the controllers on a bare Elysia
# app and asks the swagger plugin for the document in-process.

on:
  push:
    branches: [main, dev]
    paths:
      - 'server/src/**'
      - 'server/scripts/generate-openapi.ts'
      - '.github/workflows/openapi.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'server/src/**'
      - 'server/scripts/generate-openapi.ts'
  workflow_dispatch:

jobs:
  spec:
    name: Regenerate spec
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # The config module reads these at import time. Values are irrelevant —
      # nothing is served, they just have to be present.
      SERVER_ORIGIN: http://localhost:5000
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Generate spec
        working-directory: server
        run: bun run openapi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- server/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- server/openapi.json
          fi

      # On a PR the spec is only reported, never committed — pushing to a
      # contributor's branch from CI is a surprise, and a fork's token can't do
      # it anyway. The push job on dev/main is what actually keeps it current.
      - name: Report drift on pull requests
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          echo "### OpenAPI spec is out of date" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This branch changes the API surface. Run \`bun run openapi\` in \`server/\` and commit \`server/openapi.json\` to keep the diff reviewable — otherwise it will be regenerated automatically once this merges." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated spec
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add server/openapi.json
          git commit -m 'Update OpenAPI spec [skip ci]'
          git push
